<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Motes</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0f14;color:#d8e2ee;font:13px/1.35 system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;display:flex;gap:4px;padding:5px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
#top{top:0;padding-top:max(5px,env(safe-area-inset-top));pointer-events:none}
#top>*{pointer-events:auto}
#bot{bottom:0;padding-bottom:max(5px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b0f14cc 40%)}
button{font:inherit;color:#d8e2ee;background:#1a2330;border:1px solid #2c3a4d;border-radius:8px;padding:7px 10px;white-space:nowrap;flex:none}
button.on{background:#2f6f4f;border-color:#58c08a}
button:active{filter:brightness(1.3)}
#hud{flex:1;min-width:0;padding:6px 8px;background:#0b0f14b0;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#insp{position:fixed;left:6px;right:6px;bottom:56px;background:#101722f2;border:1px solid #2c3a4d;border-radius:10px;padding:8px;display:none;max-height:58vh;overflow:auto;touch-action:pan-y}
#insp h3{margin:0 0 4px;font-size:15px}
.bars{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:12px}
.bars i{display:block;height:7px;background:#223;border-radius:4px;overflow:hidden;align-self:center}
.bars i b{display:block;height:100%;background:#58c08a}
#brain{width:100%;height:190px;background:#0a0f16;border-radius:6px;margin-top:6px}
#menu{position:fixed;inset:0;background:#0b0f14f5;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#menu .tabs{display:flex;gap:4px;padding:6px;overflow-x:auto}
#menu .body{flex:1;overflow:auto;padding:8px;touch-action:pan-y;user-select:text}
.row{padding:5px 0;border-bottom:1px solid #1d2836}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dim{color:#7c8da1}
.k-species{color:#8fd1ff}.k-first{color:#ffd37a}.k-event{color:#ff9a7a}.k-fav{color:#ffe14d}.k-life{color:#9fe0a8}
#over{position:fixed;inset:0;background:#0b0f14ee;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:20px}
#prog{width:240px;height:8px;background:#223;border-radius:4px;overflow:hidden}#prog b{display:block;height:100%;width:0;background:#58c08a}
textarea{width:100%;height:90px;background:#0a0f16;color:#d8e2ee;border:1px solid #2c3a4d;border-radius:6px;user-select:text}
details{border:1px solid #223044;border-radius:8px;margin:6px 0;padding:0 10px;background:#0e151e}
summary{padding:10px 0;font-weight:600;cursor:pointer}
details[open] summary{border-bottom:1px solid #223044;margin-bottom:6px}
#mbody li{margin:3px 0}#mbody h4{margin:10px 0 4px}#mbody ul{padding-left:18px;margin:6px 0}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0}
input[type=range]{flex:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="bar"><div id="hud">Motes</div><button id="bPause">⏸</button><button id="bSpeed">1×</button><button id="bView">View</button><button id="bHelp">?</button><button id="bMenu">☰</button></div>
<div id="insp"></div>
<div id="bot" class="bar" id="tools"></div>
<div id="menu"><div class="tabs" id="tabs"></div><div class="body" id="mbody"></div></div>
<div id="over"></div>
<script type="module" src="ui.js"></script>
</body>
</html>
